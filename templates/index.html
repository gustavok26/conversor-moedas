<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Conversor de Moedas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px;
            width: 100%;
            background-color: #2c7be5;
            color: white;
            border: none;
            cursor: pointer;
        }
        .resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 5px;
        }
        .erro {
            margin-top: 20px;
            padding: 15px;
            background-color: #fdecea;
            border-radius: 5px;
            color: #c62828;
        }
    </style>
</head>
<body>
    <h1>Conversor de Moedas</h1>

    <form method="POST">
        <input type="number" name="valor" placeholder="Valor" step="0.01" required>
        <input type="text" name="de" placeholder="Moeda de origem (ex: USD)" required>
        <input type="text" name="para" placeholder="Moeda de destino (ex: BRL)" required>
        <button type="submit">Converter</button>
    </form>

    {% if resultado %}
    <div class="resultado">
        <strong>{{ resultado.valor }} {{ resultado.de }} = {{ resultado.resultado }} {{ resultado.para }}</strong>
        <br>Taxa: 1 {{ resultado.de }} = {{ resultado.taxa }} {{ resultado.para }}
    </div>
    {% endif %}

    {% if erro %}
    <div class="erro">{{ erro }}</div>
    {% endif %}
</body>
</html>
